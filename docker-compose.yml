version: '3.8'

services:
  # DDoS Detection Inference API Service
  api-service:
    build: .
    container_name: api-service
    command: python api_service.py
    ports:
      - "5000:5000"  # API port
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    networks:
      - federated_network
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dashboard Web Server (Nginx)
  dashboard:
    image: nginx:latest
    container_name: dashboard-server
    ports:
      - "8080:80"  # Dashboard accessible at localhost:8080
    volumes:
      - ./dashboard.html:/usr/share/nginx/html/index.html:ro
    networks:
      - federated_network
    depends_on:
      - api-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  federated_network:
    driver: bridge

volumes:
  data:
    driver: local
  results:
    driver: local
