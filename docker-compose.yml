version: '3.8'

services:
  # Central Federated Learning Server
  fl-server:
    build: .
    container_name: fl-server
    command: python server.py
    ports:
      - "8080:8080"  # Server communication port
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./src:/app/src
    networks:
      - federated_network
    environment:
      - SERVER_ADDRESS=fl-server:8080
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Federated Learning Client 0
  fl-client-0:
    build: .
    container_name: fl-client-0
    command: >
      python -c "
      from src.data.data_loader import DataLoader
      from src.federated.flower_client import FlowerClient
      import flwr as fl
      
      loader = DataLoader()
      X_train, y_train, X_test, y_test = loader.load_client_data(0)
      
      client = FlowerClient(X_train, y_train, X_test, y_test, client_id=0)
      fl.client.start_client(
          server_address='fl-server:8080',
          client=client.to_client()
      )
      "
    depends_on:
      fl-server:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./src:/app/src
    networks:
      - federated_network
    environment:
      - CLIENT_ID=0
      - SERVER_ADDRESS=fl-server:8080
      - LOG_LEVEL=INFO

  # Federated Learning Client 1
  fl-client-1:
    build: .
    container_name: fl-client-1
    command: >
