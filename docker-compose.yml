      fl.client.start_client(
          server_address='fl-server:8080',
          client=client.to_client()
      )
      "
    depends_on:
      fl-server:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./src:/app/src
    networks:
      - federated_network
    environment:
      - CLIENT_ID=1
      - SERVER_ADDRESS=fl-server:8080
      - LOG_LEVEL=INFO

  # Federated Learning Client 2
  fl-client-2:
